name: Public demo Pages
on:
  push:
    branches: [codex/unified-source-baseline]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-demo-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:public-demo
      - run: npm run check:public-demo-isolation
      - run: npx playwright install --with-deps chromium
      - run: npm run test:public-demo:e2e
      - name: Upload only verified static demo
        if: github.repository == 'kroblus/wuhan-eldercare-match' && github.ref == 'refs/heads/codex/unified-source-baseline' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: admin-web/dist-pages
  deploy:
    if: github.repository == 'kroblus/wuhan-eldercare-match' && github.ref == 'refs/heads/codex/unified-source-baseline' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'PUBLIC_DEMO\nURL: %s\nSHA: %s\n' "$PAGE_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
