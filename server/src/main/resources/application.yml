spring:
  application:
    name: wuhan-eldercare-visit-submission
  jackson:
    deserialization:
      fail-on-unknown-properties: true

c4:
  persistence:
    enabled: ${C4_PERSISTENCE_ENABLED:false}

c5:
  auth:
    enabled: ${C5_AUTH_ENABLED:false}
    app-id: ${C5_WECHAT_APP_ID:}
    app-secret: ${C5_WECHAT_APP_SECRET:}
    identity-hash-secret: ${C5_AUTH_HASH_SECRET:}
    session-ttl-seconds: ${C5_SESSION_TTL_SECONDS:7200}

c2:
  history:
    # Requires separate deployment-installed C2CatalogSource AND approved C2DataPolicy.
    # This flag alone never authorizes real health-data collection.
    writes-enabled: ${C2_HISTORY_WRITES_ENABLED:false}
    node-executable: ${C2_HISTORY_NODE_EXECUTABLE:node}

server:
  error:
    include-message: never
    include-stacktrace: never

institution:
  publications:
    enabled: ${INSTITUTION_PUBLICATIONS_ENABLED:false}

p1:
  intake:
    enabled: ${P1_INTAKE_ENABLED:false}
    notice-version: ${P1_NOTICE_VERSION:}
    notice-text: ${P1_NOTICE_TEXT:}
    notice-approval-ref: ${P1_NOTICE_APPROVAL_REF:}
  platform-phone: ${P1_PLATFORM_PHONE:}
  admin:
    username: ${P1_ADMIN_USERNAME:}
    password-hash: ${P1_ADMIN_PASSWORD_HASH:}
