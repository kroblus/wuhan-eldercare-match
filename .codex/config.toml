model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
# Project-scoped Codex configuration.
# SOLO_FAST_ITERATION: use the main session by default; agents remain available on demand.
# Agent availability does not require delegation or independent QA.
# Existing sandbox, approval and MCP settings are preserved.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[sandbox_workspace_write]
network_access = true

[mcp_servers.wechat-devtools]
command = "powershell.exe"
args = [
    "-NoProfile",
    "-NonInteractive",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    ".codex/wechatide-mcp.ps1"
]
env_vars = ["WECHATIDE_MCP_TOKEN"]
