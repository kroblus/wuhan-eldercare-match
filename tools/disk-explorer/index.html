<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>项目空间 · Disk Explorer</title>
  <style>/* EXPLORER_STYLE */</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div>项目空间<span class="brand-sub">DISK EXPLORER</span></div><span class="local-tag">本机快照</span></div>
    <div class="top-actions"><span id="scanTime"></span><button id="rescan" class="button dark">↻ 重新扫描</button></div>
  </header>
  <main>
    <section class="heading"><div><div class="eyebrow">WORKSPACE / STORAGE OVERVIEW</div><h1 id="projectName"></h1><p id="rootPath"></p></div><p class="scan-note">每一块，都是实际文件大小。<br>点击文件夹，继续向里看。</p></section>
    <section class="metrics" aria-label="扫描概况"><div><span>项目总大小</span><strong id="totalSize"></strong><small>逻辑大小 · 含隐藏文件</small></div><div><span>文件</span><strong id="totalFiles"></strong><small>读取名称与元数据</small></div><div><span>文件夹</span><strong id="totalDirs"></strong><small id="scanDuration"></small></div><div class="metric-last"><span>当前目录 / 总空间</span><strong id="scopeSize"></strong><small id="scopePercent"></small></div></section>
    <div class="quickbar"><div class="quick-links" id="quickLinks"></div><button class="text-button" id="scanDetails">扫描范围与说明</button></div>
    <div class="workspace">
      <aside class="tree-panel"><div class="panel-title"><h2>目录树</h2><span>按大小</span></div><nav id="directoryTree" aria-label="文件夹目录"></nav></aside>
      <section class="content-panel" aria-label="文件与空间分布">
        <div class="pathbar"><button class="icon-button" id="up" title="返回上一级" aria-label="返回上一级">↑</button><nav id="breadcrumbs" aria-label="路径"></nav></div>
        <div class="list-toolbar"><div class="view-title"><h2 id="listTitle">目录与文件</h2><span id="resultCount"></span></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索当前目录及子目录" placeholder="搜索名称或路径…"><kbd>/</kbd></label></div>
        <div id="activeFilter" class="active-filter" hidden></div>
        <div class="table-scroll"><table><thead><tr><th scope="col"><button data-sort="name">名称 <span></span></button></th><th scope="col"><button data-sort="size">大小 <span>↓</span></button></th><th scope="col">当前占比</th><th scope="col"><button data-sort="files">文件数 <span></span></button></th></tr></thead><tbody id="fileRows"></tbody></table><div class="empty" id="emptyState" hidden>没有匹配的项目。试试其他名称，或清除筛选。</div></div>
        <div class="list-footer"><span id="rangeText"></span><div class="pagination"><button class="icon-button" id="prevPage" aria-label="上一页">‹</button><span id="pageText"></span><button class="icon-button" id="nextPage" aria-label="下一页">›</button><button class="text-button" id="export">导出列表 ↓</button></div></div>
        <div class="map-heading"><div><h2>空间矩形图 <span>TREEMAP</span></h2><p>面积表示大小 · 点击进入文件夹</p></div><span id="mapCount"></span></div>
        <div class="treemap" id="treemap" aria-label="当前目录的空间矩形图"></div>
        <div class="map-legend" id="mapLegend"></div>
      </section>
      <aside class="detail-panel"><section><div class="panel-title"><h2>选中项目</h2><span id="selectedKind"></span></div><div class="selected-symbol" id="selectedSymbol">▣</div><h3 id="selectedName"></h3><div class="selected-size" id="selectedSize"></div><dl id="selectedMeta"></dl><div class="selected-path" id="selectedPath"></div><button class="button copy-button" id="copyPath">复制完整路径</button><p id="copyStatus" class="copy-status" role="status"></p></section><section class="type-section"><div class="panel-title"><h2>文件类型</h2><button class="text-button" id="clearType" hidden>清除</button></div><p class="type-hint">当前目录及子目录 · 点击筛选</p><div id="fileTypes"></div></section><div class="local-note"><span>◈</span> 数据留在这台电脑<br><small>离线查看 · 无文件删除操作</small></div></aside>
    </div>
    <footer class="page-footer"><span>WUHAN ELDERCARE / LOCAL WORKSPACE</span><span id="footerNote"></span></footer>
  </main>
  <dialog id="infoDialog"><div class="dialog-heading"><h2 id="dialogTitle"></h2><button class="icon-button" id="closeDialog" aria-label="关闭">×</button></div><div id="dialogBody"></div><button class="button" id="copyCommand" hidden>复制扫描命令</button></dialog>
  <script id="snapshot" type="application/json">/* EXPLORER_DATA */</script>
  <script>/* EXPLORER_APP */</script>
</body>
</html>
